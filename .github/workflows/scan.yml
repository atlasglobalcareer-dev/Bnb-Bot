name: BNB Meme Scanner

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore scanner database
        uses: actions/cache@v4
        with:
          path: data/scanner.db
          key: scanner-db-${{ github.run_id }}
          restore-keys: |
            scanner-db-

      - name: Run scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BSCSCAN_API_KEY: ${{ secrets.BSCSCAN_API_KEY }}
          # Product defaults are deliberately defined in config.py so old
          # repository variables cannot widen the market-cap ceiling or hide
          # sub-$50K tokens with an old score/liquidity threshold.
        run: python scan_once.py
