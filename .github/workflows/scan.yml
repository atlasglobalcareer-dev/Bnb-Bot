name: BNB Meme Scanner

on:
  # Run every 30 minutes. GitHub evaluates cron in UTC.
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

concurrency:
  group: bnb-meme-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify deployed revision
        run: |
          set -e
          echo "Event: ${GITHUB_EVENT_NAME}"
          echo "Expected branch: main"
          echo "GitHub SHA: ${GITHUB_SHA}"
          echo "Checked-out SHA: $(git rev-parse HEAD)"
          echo "Checked-out commit: $(git log -1 --oneline)"
          test "$(git branch --show-current)" = "main"
          test -f scan_once.py
          test -f scanner.py
          test -f config.py
          echo "Production revision verification: PASSED"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore scanner database
        uses: actions/cache@v4
        with:
          path: data/scanner.db
          key: scanner-db-${{ github.run_id }}
          restore-keys: |
            scanner-db-

      - name: Run scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BSCSCAN_API_KEY: ${{ secrets.BSCSCAN_API_KEY }}
        run: python scan_once.py
